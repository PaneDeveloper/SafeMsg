<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeMsg WebRTC Chat</title>
<style>
:root {
  --bg:#0a0e27; --text:#00ff41; --accent:#00bfff; --system:#ffff00; --user:#00ff88;
  --other:#ff8c00; --lock:#ff4444; --success:#51cf66; --danger:#ff6b6b;
}
body{background:#0a0e27;color:var(--text);font-family:monospace;margin:0;display:flex;flex-direction:column;height:100vh;}
#topbar{padding:10px 20px;background:rgba(0,0,0,0.5);display:flex;justify-content:space-between;border-bottom:2px solid var(--accent);}
#controls{padding:10px 20px;display:flex;gap:10px;border-bottom:1px solid rgba(0,255,65,0.2);}
#log{flex:1;overflow-y:auto;padding:15px;background:rgba(0,0,0,0.3);}
.input-area{display:flex;padding:10px 20px;gap:10px;border-top:2px solid var(--accent);}
input,button{font-family:monospace;font-size:14px;border-radius:4px;}
input{flex:1;padding:8px;border:2px solid var(--accent);background:rgba(0,255,65,0.05);color:var(--text);}
button{padding:8px 12px;border:2px solid var(--accent);background:transparent;color:var(--text);cursor:pointer;}
.msg-line{margin-bottom:6px}
.timestamp{color:rgba(0,255,65,0.6);font-size:11px;margin-right:6px;}
</style>
</head>
<body>

<div id="topbar">STATUS: <span id="statusTxt">OFFLINE</span> | Usuário: <span id="userTxt"></span></div>

<div id="controls">
  <button id="hostBtn">➕ Criar Sala</button>
  <input id="roomId" placeholder="Código da sala...">
  <button id="joinBtn">🚀 Entrar</button>
</div>

<div id="log"></div>

<div class="input-area">
  <span>➤</span>
  <input id="input" disabled placeholder="Aguardando conexão...">
</div>

<script>
const log=document.getElementById("log"),input=document.getElementById("input");
const hostBtn=document.getElementById("hostBtn"),joinBtn=document.getElementById("joinBtn");
const roomIdInput=document.getElementById("roomId"),statusTxt=document.getElementById("statusTxt");
const userTxt=document.getElementById("userTxt");
let username="User_"+Math.floor(Math.random()*999); userTxt.textContent=username;

let isHost=false,pendingJoin=false,roomId=null;
let pc=null,dataChannel=null;

// ---- logging ----
function logMsg(user,text,color="var(--user)"){
  const d=document.createElement("div"); d.className="msg-line"; 
  d.innerHTML=`<span class="timestamp">[${new Date().toLocaleTimeString()}]</span> <b>[${user}]</b> ${text}`; 
  d.style.color=color; log.appendChild(d); log.scrollTop=log.scrollHeight;
}

// ---- Signaling via WebSocket ----
// OBS: tu precisa de um WebSocket server rodando para signaling (ex: Node.js ws)
const ws=new WebSocket("wss://SEU_WEBSOCKET_SERVER_AQUI"); // <<< trocar URL
ws.onopen=()=>logMsg("Sistema","Conectado ao servidor de signaling.","var(--success)");
ws.onmessage=async e=>{
  const msg=JSON.parse(e.data);
  if(msg.room!==roomId) return;

  if(msg.type==="JOIN_REQUEST" && isHost){
    logMsg("Sistema",`${msg.user} quer entrar!`, "var(--system)");
    logMsg("Sistema",`Digite: /accept ${msg.user} ou /reject ${msg.user}`,"var(--system)");
  }

  if(msg.action==="ACCEPT_"+username){
    pendingJoin=false; input.disabled=false;
    logMsg("Sistema","✓ Você foi aprovado!","var(--success)");
    startPeerConnection(true); // inicia a conexão P2P
  }

  if(msg.action==="REJECT_"+username){
    pendingJoin=false; input.disabled=true;
    logMsg("Sistema","✗ Solicitação rejeitada.","var(--danger)");
  }

  if(msg.sdp){
    await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    if(msg.sdp.type==="offer"){
      const answer=await pc.createAnswer();
      await pc.setLocalDescription(answer);
      ws.send(JSON.stringify({room:roomId,sdp:answer}));
    }
  }

  if(msg.candidate){
    try{ await pc.addIceCandidate(msg.candidate); }catch(e){console.log(e);}
  }
};

// ---- WebRTC ----
function startPeerConnection(isInitiator=false){
  pc=new RTCPeerConnection();
  
  pc.onicecandidate=e=>{ if(e.candidate) ws.send(JSON.stringify({room:roomId,candidate:e.candidate})); }
  
  pc.ondatachannel=e=>{
    dataChannel=e.channel;
    setupDataChannel();
  };

  if(isInitiator){
    dataChannel=pc.createDataChannel("chat");
    setupDataChannel();
    pc.createOffer().then(offer=>pc.setLocalDescription(offer).then(()=>ws.send(JSON.stringify({room:roomId,sdp:offer}))));
  }
}

function setupDataChannel(){
  dataChannel.onopen=()=>logMsg("Sistema","✅ Canal P2P aberto!","var(--success)");
  dataChannel.onmessage=e=>logMsg("Outro",e.data,"var(--other)");
}

// ---- Host / Join ----
hostBtn.onclick=()=>{
  isHost=true;
  const r=Math.random().toString(36).substring(2,6).toUpperCase();
  const k=Math.random().toString(36).substring(2,6).toUpperCase();
  roomIdInput.value=`${r}-${k}`; roomId=`${r}`; statusTxt.textContent="SALA "+roomId; statusTxt.style.color="var(--success)";
  input.disabled=false; logMsg("Sistema","Sala criada. Aguardando usuários...","var(--success)");
};

joinBtn.onclick=()=>{
  if(!roomIdInput.value.trim()){ logMsg("Erro","Insira código da sala!","var(--danger)"); return; }
  roomId=roomIdInput.value.split("-")[0]; statusTxt.textContent="SALA "+roomId; statusTxt.style.color="var(--success)";
  pendingJoin=true; input.disabled=true;
  logMsg("Sistema","🔒 Aguardando aprovação do host...","var(--lock)");
  ws.send(JSON.stringify({room:roomId,type:"JOIN_REQUEST",user:username}));
};

// ---- input ----
input.onkeydown=e=>{
  if(e.key!=="Enter"||!input.value.trim()) return;
  const v=input.value.trim();

  if(isHost && v.startsWith("/accept ")){
    const u=v.split(" ")[1];
    ws.send(JSON.stringify({room:roomId,action:"ACCEPT_"+u}));
    logMsg("Sistema",`✓ ${u} aprovado!`,"var(--success)"); input.value=""; return;
  }
  if(isHost && v.startsWith("/reject ")){
    const u=v.split(" ")[1];
    ws.send(JSON.stringify({room:roomId,action:"REJECT_"+u}));
    logMsg("Sistema",`✗ ${u} rejeitado.`,"var(--danger)"); input.value=""; return;
  }

  if(dataChannel && dataChannel.readyState==="open"){ dataChannel.send(v); logMsg(username,v,"var(--user)"); }
  input.value="";
};
</script>
</body>
</html>

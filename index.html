<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeMsg Online</title>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<style>
body { background:#0a0e27; color:#00ff41; font-family:monospace; display:flex; flex-direction:column; height:100vh; margin:0; }
#log { flex:1; overflow-y:auto; padding:15px; border-bottom:1px solid #333; }
#inputArea { display:flex; padding:10px; gap:5px; }
input { flex:1; padding:8px; background:#111; border:1px solid #00ff41; color:#0f0; }
button { padding:8px; background:#111; border:1px solid #00ff41; color:#0f0; cursor:pointer; }
.msg { margin-bottom:5px; }
.msg b { color:#0ff; }
</style>
</head>
<body>

<div id="log"></div>
<div id="inputArea">
  <input id="input" placeholder="Digite algo..." disabled>
  <button id="sendBtn" disabled>Enviar</button>
</div>
<div style="padding:10px; background:#111;">
  Sua Sala (ID): <input id="roomId" placeholder="ID da sala">
  <button id="hostBtn">Criar Sala</button>
  <button id="joinBtn">Entrar</button>
</div>

<script>
const log = document.getElementById('log');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const hostBtn = document.getElementById('hostBtn');
const joinBtn = document.getElementById('joinBtn');
const roomInput = document.getElementById('roomId');

let peer, conn;
const username = 'User_'+Math.floor(Math.random()*999);

function logMsg(user, text) {
  const div = document.createElement('div');
  div.className = 'msg';
  div.innerHTML = `<b>[${user}]</b> ${text}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// Criar peer como host
hostBtn.onclick = () => {
  const roomId = (roomInput.value || Math.random().toString(36).substring(2,6)).toUpperCase();
  roomInput.value = roomId;
  peer = new Peer(roomId, { host:'peerjs.com', port:443, secure:true });
  
  peer.on('open', id => {
    logMsg('Sistema', 'Sala criada! ID: '+id);
    input.disabled = false; sendBtn.disabled = false;
  });

  peer.on('connection', c => {
    conn = c;
    conn.on('data', data => logMsg(data.user, data.text));
    logMsg('Sistema','Um usuário entrou!');
  });
};

// Entrar em sala
joinBtn.onclick = () => {
  const roomId = roomInput.value.trim();
  if (!roomId) { alert('Coloque o ID da sala!'); return; }
  peer = new Peer(undefined, { host:'peerjs.com', port:443, secure:true });
  
  peer.on('open', id => {
    conn = peer.connect(roomId);
    conn.on('open', () => {
      input.disabled = false; sendBtn.disabled = false;
      logMsg('Sistema','Conectado à sala '+roomId);
    });
    conn.on('data', data => logMsg(data.user, data.text));
  });
};

// Enviar mensagem
  //Fino Senhores 🍷🗿
sendBtn.onclick = () => {
  const msg = input.value.trim();
  if (!msg) return;
  logMsg(username, msg);
  if(conn && conn.open) conn.send({user:username, text:msg});
  input.value = '';
};
</script>
</body>
</html>

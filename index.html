<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chat Seguro e Privado com Criptografia de Ponta a Ponta :D</title>

<style>
:root {
  --bg-color:#0a0a0a;
  --text-color:#00ff41;
  --accent-color:#008f11;
  --system-color:#ffff00;
  --user-color:#00ffff;
  --other-color:#ff8c00;
  --crypto-color:#ff00ff;
  --lock-color:#ff4444;
  --hybrid-color:#00bfff;
}
body{
  background:var(--bg-color);
  color:var(--text-color);
  font-family:monospace;
  margin:0;
  display:flex;
  flex-direction:column;
  height:100vh;
}
#topbar,#controls,.input-area{padding:10px;border-bottom:1px solid #333;background:#111;}
#log{flex:1;overflow-y:auto;padding:15px;}
.msg-line{margin-bottom:6px}
.timestamp{color:#666;font-size:10px}
.lock-notice{color:var(--lock-color);text-align:center;border:1px dashed var(--lock-color);padding:10px;}
input{flex:1;background:transparent;border:none;color:var(--text-color);outline:none;}
button{background:transparent;border:1px solid var(--text-color);color:var(--text-color);cursor:pointer;}
button:hover{background:var(--text-color);color:#000}
.error-msg {
    color: red;
    font-weight: bold;
    text-align: center;
    margin: 10px 0;
  }
</style>
<script src="https://js.pusher.com/beams/2.1.0/push-notifications-cdn.js"></script>
</head>
<body>

<div id="topbar">STATUS: <span id="statusTxt">OFFLINE</span> | Usuário: <span id="userTxt"></span></div>

<div id="controls">
<button id="hostBtn">Criar Sala</button>
<input id="roomId" placeholder="Código da Sala">
<button id="joinBtn">Entrar</button>
</div>

<div id="log"></div>

<div class="input-area">
<span>&gt;</span>
<input id="input" disabled placeholder="Aguardando conexão...">
</div>

<script>
const log=document.getElementById("log");
const input=document.getElementById("input");
const hostBtn=document.getElementById("hostBtn");
const joinBtn=document.getElementById("joinBtn");
const roomIdInput=document.getElementById("roomId");
const statusTxt=document.getElementById("statusTxt");
const userTxt=document.getElementById("userTxt");

let roomId=null,isHost=false,pendingJoin=false,messagesLocked=true;
const username="User_"+Math.floor(Math.random()*999);
userTxt.textContent=username;

// BroadcastChannel
const channel = new BroadcastChannel("TERMINAL_CHAT_V3");

function logMsg(user,text,color){
  const t=new Date().toLocaleTimeString();
  const d=document.createElement("div");
  d.className="msg-line";
  d.style.color=color;
  d.innerHTML=`<span class="timestamp">[${t}]</span> <b>[${user}]</b> ${text}`;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

function emit(data){
  channel.postMessage({...data,_ts:Date.now()+Math.random()});
}

function configurarSala(code){
  const p=code.split("-");
  roomId=p[0];
  statusTxt.textContent="SALA "+roomId;
  statusTxt.style.color="lime";
}

hostBtn.onclick = () => {
  isHost = true;
  const r = Math.random().toString(36).substring(2, 6).toUpperCase(); // 4 characters
  const k = Math.random().toString(36).substring(2, 6).toUpperCase(); // 4 characters
  roomIdInput.value = `${r}-${k}`; // Format XXXX-XXXX
  configurarSala(roomIdInput.value);
  messagesLocked = false;
  input.disabled = false;
  input.placeholder = "Digite uma Mensagem ou Comando...";
  logMsg("Sistema", "Sala Criada.", "var(--system-color)");
};

function isValidRoomCode(code) {
    return /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code);
  }

joinBtn.onclick = () => {
    const roomCode = roomIdInput.value.trim();
    if (!roomCode) {
      logMsg("Erro", "Por favor, insira um código de sala.", "red");
      return;
    }

    if (!isValidRoomCode(roomCode)) {
      logMsg("Erro", "Código de sala inválido. Use o formato XXXX-XXXX.", "red");
      return;
    }

    configurarSala(roomCode);
    pendingJoin = true;
    input.disabled = true;
    log.innerHTML = '<div class="lock-notice">Aguardando aprovação do criador da sala</div>';

    emit({ room: roomId, type: "JOIN_REQUEST", user: username });
  };

input.onkeydown=e=>{
  if(e.key!=="Enter"||!input.value.trim())return;
  const v=input.value.trim();

  if(isHost && v.startsWith("/ACCEPT ")){
    const u=v.split(" ")[1];
    emit({room:roomId,action:"ACCEPT_"+u});
    logMsg("Sistema",`Usuário ${u} aprovado.`,"var(--hybrid-color)");
    input.value=""; return;
  }

  if(isHost && v.startsWith("/REJECT ")){
    const u=v.split(" ")[1];
    emit({room:roomId,action:"REJECT_"+u});
    logMsg("Sistema",`Usuário ${u} recusado.`,"var(--lock-color)");
    input.value=""; return;
  }

  logMsg(username,v,"var(--user-color)");
  input.value="";
};

channel.onmessage = (e) => {
  const data = e.data;

  // Verifica se a mensagem é para a sala correta
  if (!data.room || data.room !== roomId) return;

  // pedido join
  if (data.type === "JOIN_REQUEST" && isHost) {
    logMsg("Sistema", `${data.user} quer entrar na sala.`, "var(--system-color)");
    logMsg("Sistema", `/accept ${data.user} para aceitar | /cancel ${data.user} para cancelar`, "var(--system-color)");
  }

  // aceito
  if (data.action === "ACCEPT_" + username) {
    pendingJoin = false;
    messagesLocked = false;
    input.disabled = false;
    log.innerHTML = "";
    logMsg("Sistema", "Entrada autorizada por um Admin", "var(--hybrid-color)");
  }

  // recusado
  if (data.action === "REJECT_" + username) {
    pendingJoin = false;
    input.disabled = true;
    log.innerHTML = ""; // Limpa o log ao ser rejeitado
    logMsg("Sistema", "Entrada recusada por um Admin.", "var(--lock-color)");
  }
};

const signalingServer = new WebSocket('wss://your-signaling-server-url'); // Substitua pela URL do servidor de sinalização
let peerConnection;
const config = {
  iceServers: [
    { urls: 'stun:stun.l.google.com:19302' },
  ],
};

signalingServer.onmessage = (message) => {
  const data = JSON.parse(message.data);

  switch (data.type) {
    case 'JOIN_REQUEST':
      if (isHost && data.roomId === roomId) { // Ensure the roomId matches
        logMsg("Sistema", `${data.user} quer entrar na sala.`, "var(--system-color)");
        logMsg("Sistema", `/accept ${data.user} para aceitar | /cancel ${data.user} para cancelar`, "var(--system-color)");
      }
      break;

    case 'SIGNAL':
      if (peerConnection) {
        peerConnection.setRemoteDescription(new RTCSessionDescription(data.signal))
          .then(() => {
            if (data.signal.type === 'offer') {
              peerConnection.createAnswer()
                .then((answer) => peerConnection.setLocalDescription(answer))
                .then(() => {
                  signalingServer.send(
                    JSON.stringify({
                      type: 'SIGNAL',
                      signal: peerConnection.localDescription,
                      roomId: roomId,
                      user: username,
                    })
                  );
                });
            }
          })
          .catch(console.error);
      }
      break;
  }
};

function createPeerConnection() {
  peerConnection = new RTCPeerConnection(config);

  peerConnection.onicecandidate = (event) => {
    if (event.candidate) {
      signalingServer.send(
        JSON.stringify({
          type: 'SIGNAL',
          signal: event.candidate,
          roomId: roomId,
          user: username,
        })
      );
    }
  };

  peerConnection.ondatachannel = (event) => {
    const channel = event.channel;
    channel.onmessage = (e) => {
      const { user, text } = JSON.parse(e.data);
      logMsg(user, text, "var(--other-color)");
    };
  };
}

hostBtn.onclick = () => {
  isHost = true;
  const r = Math.random().toString(36).substring(2, 6).toUpperCase();
  const k = Math.random().toString(36).substring(2, 6).toUpperCase();
  roomIdInput.value = `${r}-${k}`;
  configurarSala(roomIdInput.value);
  messagesLocked = false;
  input.disabled = false;
  input.placeholder = "Digite uma Mensagem ou Comando...";
  logMsg("Sistema", "Sala Criada.", "var(--system-color)");

  signalingServer.send(
    JSON.stringify({
      type: 'CREATE_ROOM',
      roomId: roomId,
    })
  );

  createPeerConnection();

  const dataChannel = peerConnection.createDataChannel('chat');
  dataChannel.onmessage = (e) => {
    const { user, text } = JSON.parse(e.data);
    logMsg(user, text, "var(--other-color)");
  };
};

joinBtn.onclick = () => {
  const roomCode = roomIdInput.value.trim();
  if (!roomCode) {
    logMsg("Erro", "Por favor, insira um código de sala.", "red");
    return;
  }

  if (!isValidRoomCode(roomCode)) {
    logMsg("Erro", "Código de sala inválido. Use o formato XXXX-XXXX.", "red");
    return;
  }

  configurarSala(roomCode);
  pendingJoin = true;
  input.disabled = true;
  log.innerHTML = '<div class="lock-notice">Aguardando aprovação do criador da sala</div>';

  signalingServer.send(
    JSON.stringify({
      type: 'JOIN_REQUEST',
      roomId: roomId,
      user: username,
    })
  );

  createPeerConnection();
};
</script>
</body>
</html>

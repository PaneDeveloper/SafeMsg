<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TERMINAL CHAT v3.3.5 (Join Approval)</title>

<style>
:root {
  --bg-color:#0a0a0a;
  --text-color:#00ff41;
  --accent-color:#008f11;
  --system-color:#ffff00;
  --user-color:#00ffff;
  --other-color:#ff8c00;
  --crypto-color:#ff00ff;
  --lock-color:#ff4444;
  --hybrid-color:#00bfff;
}

body{
  background:var(--bg-color);
  color:var(--text-color);
  font-family:monospace;
  margin:0;
  display:flex;
  flex-direction:column;
  height:100vh;
}

#topbar,#controls,.input-area{
  padding:10px;
  border-bottom:1px solid #333;
  background:#111;
}

#log{
  flex:1;
  overflow-y:auto;
  padding:15px;
}

.msg-line{margin-bottom:6px}
.timestamp{color:#666;font-size:10px}

.lock-notice{
  color:var(--lock-color);
  text-align:center;
  border:1px dashed var(--lock-color);
  padding:10px;
}

input{
  flex:1;
  background:transparent;
  border:none;
  color:var(--text-color);
  outline:none;
}

button{
  background:transparent;
  border:1px solid var(--text-color);
  color:var(--text-color);
  cursor:pointer;
}
button:hover{background:var(--text-color);color:#000}
</style>
</head>

<body>

<div id="topbar">
STATUS: <span id="statusTxt">OFFLINE</span> |
USER: <span id="userTxt"></span>
</div>

<div id="controls">
<button id="hostBtn">CRIAR HOST</button>
<input id="roomId" placeholder="SALA-CHAVE">
<button id="joinBtn">CONECTAR</button>
</div>

<div id="log"></div>

<div class="input-area">
<span>&gt;</span>
<input id="input" disabled placeholder="Aguardando conexão...">
</div>

<script>
const log = document.getElementById("log");
const input = document.getElementById("input");
const hostBtn = document.getElementById("hostBtn");
const joinBtn = document.getElementById("joinBtn");
const roomIdInput = document.getElementById("roomId");
const statusTxt = document.getElementById("statusTxt");
const userTxt = document.getElementById("userTxt");

let roomId=null;
let cryptoKey="";
let isHost=false;
let pendingJoin=false;
let messagesLocked=true;

const username="User_"+Math.floor(Math.random()*999);
userTxt.textContent=username;

function logMsg(user,text,color){
  const t=new Date().toLocaleTimeString();
  const d=document.createElement("div");
  d.className="msg-line";
  d.style.color=color;
  d.innerHTML=`<span class="timestamp">[${t}]</span> <b>[${user}]</b> ${text}`;
  log.appendChild(d);
  log.scrollTop=log.scrollHeight;
}

function enviarAdmin(data){
  localStorage.setItem("cli_chat_admin",JSON.stringify(data));
  localStorage.removeItem("cli_chat_admin");
}

function configurarSala(code){
  const p=code.split("-");
  roomId=p[0];
  cryptoKey=p[1]||p[0];
  statusTxt.textContent="SALA "+roomId;
  statusTxt.style.color="lime";
}

hostBtn.onclick=()=>{
  isHost=true;
  const r=Math.random().toString(36).substring(2,6).toUpperCase();
  const k=Math.random().toString(36).substring(2,8).toUpperCase();
  roomIdInput.value=`${r}-${k}`;
  configurarSala(roomIdInput.value);
  messagesLocked=false;
  input.disabled=false;
  input.placeholder="Comando ou mensagem...";
  logMsg("Sistema","Host criado.","var(--system-color)");
};

joinBtn.onclick=()=>{
  if(!roomIdInput.value.trim())return;
  configurarSala(roomIdInput.value.trim());
  pendingJoin=true;
  input.disabled=true;
  log.innerHTML='<div class="lock-notice">Aguardando aprovação do admin...</div>';

  enviarAdmin({
    room:roomId,
    type:"JOIN_REQUEST",
    user:username
  });
};

input.onkeydown=e=>{
  if(e.key!=="Enter"||!input.value.trim())return;
  const v=input.value.trim();

  if(isHost && v.startsWith("/ACCEPT ")){
    const u=v.split(" ")[1];
    enviarAdmin({room:roomId,action:"ACCEPT_"+u});
    logMsg("Sistema",`Usuário ${u} aprovado.`,"var(--hybrid-color)");
    input.value="";
    return;
  }

  if(isHost && v.startsWith("/REJECT ")){
    const u=v.split(" ")[1];
    enviarAdmin({room:roomId,action:"REJECT_"+u});
    logMsg("Sistema",`Usuário ${u} recusado.`,"var(--lock-color)");
    input.value="";
    return;
  }

  logMsg(username,v,"var(--user-color)");
  input.value="";
};

window.addEventListener("storage",e=>{
  if(!roomId||!e.newValue)return;
  const s=JSON.parse(e.newValue);
  if(!s.room||!s.room.includes(roomId))return;

  if(s.type==="JOIN_REQUEST" && isHost){
    logMsg("Sistema",`${s.user} pediu para entrar.`,"var(--system-color)");
    logMsg("Sistema",`/ACCEPT ${s.user}  |  /REJECT ${s.user}`,"var(--system-color)");
  }

  if(s.action==="ACCEPT_"+username){
    pendingJoin=false;
    messagesLocked=false;
    input.disabled=false;
    log.innerHTML="";
    logMsg("Sistema","Entrada autorizada.","var(--hybrid-color)");
  }

  if(s.action==="REJECT_"+username){
    pendingJoin=false;
    input.disabled=true;
    logMsg("Sistema","Entrada recusada.","var(--lock-color)");
  }
});
</script>
</body>
</html>

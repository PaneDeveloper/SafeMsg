<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SafeMsg P2P</title>
<style>
body {
  background:#0a0e27;
  color:#00ff41;
  font-family:monospace;
  margin:0;
  display:flex;
  flex-direction:column;
  height:100vh;
}
#topbar {
  padding:15px;
  display:flex;
  justify-content:space-between;
  border-bottom:2px solid #00d4ff;
}
#controls {
  display:flex;
  gap:10px;
  padding:10px;
}
#roomId {
  flex:1;
  padding:5px;
  border:2px solid #00d4ff;
  border-radius:4px;
  background:rgba(0,255,65,0.05);
  color:#00ff41;
}
button {
  padding:5px 10px;
  border:2px solid #00d4ff;
  border-radius:4px;
  background:transparent;
  color:#00ff41;
  cursor:pointer;
}
button:hover {background:#00d4ff;color:#0a0e27;}
#log {
  flex:1;
  overflow-y:auto;
  padding:10px;
  border-top:1px solid #00d4ff;
}
.msg-line {margin-bottom:6px;}
.msg-user {color:#00ff88;}
.msg-other {color:#ff8c00;}
.msg-system {color:#ffff00;}
.input-area {
  display:flex;
  padding:10px;
  border-top:2px solid #00d4ff;
}
#input {
  flex:1;
  padding:5px;
  border:2px solid #00d4ff;
  border-radius:4px;
  background:rgba(0,255,65,0.05);
  color:#00ff41;
}
</style>
</head>
<body>

<div id="topbar">
  <div>SafeMsg P2P</div>
  <div>Usuário: <span id="userTxt"></span></div>
</div>

<div id="controls">
  <button id="hostBtn">Criar Sala</button>
  <input id="roomId" placeholder="Código da Sala (XXXX)">
  <button id="joinBtn">Entrar</button>
</div>

<div id="log"></div>

<div class="input-area">
  <input id="input" disabled placeholder="Digite sua mensagem...">
  <button id="sendBtn" disabled>Enviar</button>
</div>

<script>
const userTxt = document.getElementById("userTxt");
const hostBtn = document.getElementById("hostBtn");
const joinBtn = document.getElementById("joinBtn");
const roomInput = document.getElementById("roomId");
const log = document.getElementById("log");
const input = document.getElementById("input");
const sendBtn = document.getElementById("sendBtn");

const username = "User_" + Math.floor(Math.random()*999);
userTxt.textContent = username;

let pc = null;
let dc = null;
let isHost = false;

function logMsg(user, text, cls="msg-system"){
  const div = document.createElement("div");
  div.className = "msg-line "+cls;
  div.innerHTML = `<b>[${user}]</b> ${text}`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

// Simples PeerServer em WebRTC sem Node
async function createConnection(isHost){
  pc = new RTCPeerConnection();

  pc.ondatachannel = (e) => {
    dc = e.channel;
    setupDataChannel();
  }

  if(isHost){
    dc = pc.createDataChannel("chat");
    setupDataChannel();
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    logMsg("Sistema", "Oferta criada, compartilhe este código com o amigo.", "msg-system");
    console.log("Oferta SDP (copie e envie pro outro usuário):", JSON.stringify(offer));
  } else {
    const sdpStr = prompt("Cole aqui a oferta do host:");
    if(!sdpStr) return alert("Oferta inválida!");
    const offer = JSON.parse(sdpStr);
    await pc.setRemoteDescription(offer);
    const answer = await pc.createAnswer();
    await pc.setLocalDescription(answer);
    logMsg("Sistema", "Resposta criada, envie este SDP de volta pro host.", "msg-system");
    console.log("Resposta SDP (copie e envie pro host):", JSON.stringify(answer));
  }

  pc.onicecandidate = (event) => {
    if(event.candidate){
      console.log("ICE Candidate (compartilhe se necessário):", JSON.stringify(event.candidate));
    }
  }
}

function setupDataChannel(){
  dc.onopen = () => {
    input.disabled = false;
    sendBtn.disabled = false;
    logMsg("Sistema", "Conexão estabelecida! Pode enviar mensagens.", "msg-system");
  }
  dc.onmessage = (e) => {
    logMsg("Amigo", e.data, "msg-other");
  }
}

hostBtn.onclick = async () => {
  isHost = true;
  await createConnection(true);
}

joinBtn.onclick = async () => {
  isHost = false;
  await createConnection(false);
}

sendBtn.onclick = () => {
  if(dc && dc.readyState === "open"){
    const msg = input.value.trim();
    if(msg){
      logMsg(username, msg, "msg-user");
      dc.send(msg);
      input.value = "";
    }
  }
}

input.addEventListener("keydown", e => {if(e.key==="Enter") sendBtn.click();});
</script>

</body>
</html>
